server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API и артефакты — проксируем бэкенду
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /artifacts/ {
        proxy_pass http://api:8000/artifacts/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-кабинет: /app, /app/, /app/<любой путь>
    # BrowserRouter(basename="/app") обрабатывает роутинг на клиенте
    location /app {
        try_files $uri $uri/ /app.html;
    }

    # Ассеты и прочие статические файлы
    # (Vite кладёт js/css в /assets/, иконки и прочее — в корень dist/)
    # Корень "/" → index.html (лендинг)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
