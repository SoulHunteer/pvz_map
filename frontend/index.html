<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PVZ Monitor — Находите золотые зоны WB раньше конкурентов</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0f1e38;
  --navy-light: #1a2b4a;
  --navy-mid: #243555;
  --gold: #0a929b;
  --gold-light: #e8cc6a;
  --gold-dim: rgba(10, 146, 155, 0.15);
  --purple: #9c27b0;
  --purple-light: rgba(156, 39, 176, 0.15);
  --teal: #0d9488;
  --teal-light: rgba(13, 148, 136, 0.1);
  --white: #ffffff;
  --off-white: #f8f9fb;
  --text: #111827;
  --text-muted: #6b7280;
  --border: rgba(255,255,255,0.08);
  --border-light: rgba(0,0,0,0.07);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  font-size: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: "Inter", -apple-system, sans-serif;
  background: var(--off-white);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 { font-family: "Space Grotesk", "Inter", sans-serif; line-height: 1.15; letter-spacing: -0.02em; }

a { color: inherit; text-decoration: none; }

/* ── NAV ── */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  padding: 12px 24px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(15, 30, 56, 0.85);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  transition: background 0.3s;
}
.nav-brand { display: flex; align-items: center; gap: 10px; }
.nav-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--gold), #077a82);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-family: "Space Grotesk", sans-serif; font-weight: 800; font-size: 16px; color: var(--navy);
}
.nav-title { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 17px; color: var(--white); }
.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-link { color: rgba(255,255,255,0.7); font-size: 14px; font-weight: 500; padding: 6px 14px; border-radius: 8px; cursor: pointer; border: none; background: none; transition: all 0.2s; }
.nav-link:hover { color: var(--white); background: rgba(255,255,255,0.08); }
.nav-cta {
  background: linear-gradient(135deg, var(--gold), #077a82);
  color: #ffffff; font-weight: 700; font-size: 14px;
  padding: 8px 20px; border-radius: 10px; border: none; cursor: pointer;
  transition: all 0.2s;
}
.nav-cta:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(10,146,155,0.4); }

/* ── HERO ── */
.hero {
  min-height: 100vh;
  background: var(--navy);
  position: relative; overflow: hidden;
  display: flex; align-items: center;
  padding: 160px 0 80px;
}
.hero-bg {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 80% 60% at 70% 50%, rgba(156,39,176,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 20% 80%, rgba(13,148,136,0.08) 0%, transparent 50%),
    radial-gradient(ellipse 40% 40% at 80% 10%, rgba(10,146,155,0.06) 0%, transparent 50%);
}
.hero-grid-lines {
  position: absolute; inset: 0; pointer-events: none; opacity: 0.03;
  background-image: linear-gradient(rgba(255,255,255,1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,1) 1px, transparent 1px);
  background-size: 60px 60px;
}
.hero-inner {
  max-width: 1240px; margin: 0 auto; padding: 0 32px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--gold-dim); border: 1px solid rgba(10,146,155,0.3);
  border-radius: 100px; padding: 6px 14px; margin-bottom: 24px;
}
.hero-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: pulse 2s infinite; }
.hero-badge span { font-size: 13px; font-weight: 600; color: var(--gold); }
.hero-title { font-size: clamp(2.2rem, 4vw, 3.4rem); font-weight: 800; color: var(--white); margin-bottom: 20px; }
.hero-title em { font-style: normal; background: linear-gradient(135deg, var(--gold), var(--gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 1.1rem; line-height: 1.7; color: rgba(255,255,255,0.65); margin-bottom: 36px; max-width: 480px; }
.hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.btn-hero-primary {
  background: linear-gradient(135deg, var(--gold), #077a82);
  color: #ffffff; font-weight: 800; font-size: 16px;
  padding: 16px 32px; border-radius: 14px; border: none; cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 32px rgba(10,146,155,0.35);
  transition: all 0.25s;
  text-decoration: none;
}
.btn-hero-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(10,146,155,0.5); }
.btn-hero-secondary {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
  color: var(--white); font-weight: 600; font-size: 15px;
  padding: 15px 28px; border-radius: 14px; cursor: pointer;
  transition: all 0.2s;
}
.btn-hero-secondary:hover { background: rgba(255,255,255,0.12); }
.hero-trust { display: flex; align-items: center; gap: 20px; margin-top: 32px; flex-wrap: wrap; }
.hero-trust-item { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.5); font-size: 13px; font-weight: 500; }
.hero-trust-item svg { opacity: 0.7; }

/* Hero map widget */
.hero-map-widget {
  position: relative;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.4), 0 0 0 1px rgba(10,146,155,0.1);
}
.map-widget-header {
  padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px;
}
.map-dot { width: 10px; height: 10px; border-radius: 50%; }
.live-badge {
  margin-left: auto; display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 700; color: #4ade80;
  background: rgba(74,222,128,0.1); padding: 3px 8px; border-radius: 100px;
}
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: #4ade80; animation: pulse 1.5s infinite; }

/* ── COUNTER TICKER ── */
.counter-ticker {
  background: rgba(10,146,155,0.06); border-top: 1px solid rgba(10,146,155,0.15); border-bottom: 1px solid rgba(10,146,155,0.15);
  padding: 0; overflow: hidden;
}
.ticker-inner {
  max-width: 1240px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: stretch; gap: 0;
}
.ticker-stat {
  flex: 1; padding: 20px 24px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-right: 1px solid rgba(10,146,155,0.12);
}
.ticker-stat:last-child { border-right: none; }
.ticker-num { font-family: "Space Grotesk", sans-serif; font-size: 1.6rem; font-weight: 800; color: var(--white); }
.ticker-label { font-size: 12px; color: rgba(255,255,255,0.45); font-weight: 500; text-align: center; }

/* ── SECTIONS ── */
.section { padding: 100px 0; }
.section-dark { background: var(--navy); color: var(--white); }
.section-light { background: var(--off-white); }
.section-mid { background: #f2f4f8; }
.container { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
.section-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; }
.section-title { font-size: clamp(1.8rem, 3vw, 2.6rem); font-weight: 800; margin-bottom: 16px; }
.section-title.light { color: var(--white); }
.section-sub { font-size: 1.05rem; color: var(--text-muted); line-height: 1.7; max-width: 560px; }
.section-sub.light { color: rgba(255,255,255,0.6); }
.section-head { margin-bottom: 60px; }

/* ── BEFORE / AFTER ── */
.ba-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.ba-card {
  border-radius: var(--radius-xl); padding: 36px; display: flex; flex-direction: column; gap: 20px;
}
.ba-card.before { background: #fff5f5; border: 1.5px solid #fecaca; }
.ba-card.after { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
.ba-label { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.ba-label.before { color: #ef4444; }
.ba-label.after { color: #22c55e; }
.ba-title { font-size: 1.3rem; font-weight: 700; color: var(--text); }
.ba-items { display: flex; flex-direction: column; gap: 12px; }
.ba-item { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: #374151; }
.ba-icon { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; margin-top: 1px; }
.ba-icon.bad { background: #fee2e2; color: #ef4444; }
.ba-icon.good { background: #dcfce7; color: #22c55e; }

/* ── MAP DEMO ── */
.map-demo-wrap {
  background: var(--navy-light);
  border-radius: var(--radius-xl);
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
}
.map-demo-toolbar {
  padding: 14px 20px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.layer-toggle {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1.5px solid; transition: all 0.2s;
}
.map-demo-body { position: relative; height: 380px; overflow: hidden; }
.map-demo-body .map-static-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: block;
}
.map-demo-badge {
  position: absolute; top: 14px; right: 14px; z-index: 5;
  background: rgba(15,30,56,0.8); backdrop-filter: blur(10px);
  border: 1px solid rgba(10,146,155,0.3);
  color: var(--white); font-size: 11px; font-weight: 600;
  padding: 5px 10px; border-radius: 100px;
  letter-spacing: 0.4px;
}
.map-demo-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.3); font-size: 13px;
}
.map-tooltip-card {
  position: absolute; z-index: 10;
  background: rgba(15,30,56,0.95); backdrop-filter: blur(12px);
  border: 1px solid rgba(10,146,155,0.3); border-radius: 12px;
  padding: 12px 16px; min-width: 200px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  pointer-events: none;
}
.tooltip-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.tooltip-key { font-size: 11px; color: rgba(255,255,255,0.5); }
.tooltip-val { font-size: 12px; font-weight: 700; color: var(--white); }

/* ── FEATURES ── */
.features-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.feature-card {
  background: var(--white);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 28px;
  display: flex; flex-direction: column; gap: 12px;
  transition: all 0.25s;
  position: relative; overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--purple));
  opacity: 0; transition: opacity 0.25s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); border-color: rgba(10,146,155,0.3); }
.feature-card:hover::before { opacity: 1; }
.feature-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.feature-icon.gold { background: var(--gold-dim); }
.feature-icon.purple { background: var(--purple-light); }
.feature-icon.teal { background: var(--teal-light); }
.feature-title { font-size: 1rem; font-weight: 700; color: var(--text); }
.feature-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

/* ── HOW IT WORKS ── */
.steps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; position: relative; }
.steps-grid::before {
  content: ''; position: absolute; top: 32px; left: calc(12.5% + 16px); right: calc(12.5% + 16px); height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--purple));
  z-index: 0;
}
.step-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px; padding: 0 20px; position: relative; z-index: 1; }
.step-num {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), #077a82);
  display: flex; align-items: center; justify-content: center;
  font-family: "Space Grotesk", sans-serif; font-size: 1.4rem; font-weight: 800;
  color: var(--navy); box-shadow: 0 0 0 4px var(--off-white), 0 0 0 8px rgba(10,146,155,0.2);
  flex-shrink: 0;
}
.step-title { font-size: 1rem; font-weight: 700; }
.step-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

/* ── PRICING ── */
.pricing-toggle-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
.pricing-toggle {
  background: rgba(255,255,255,0.08); border-radius: 100px; padding: 4px;
  display: flex; gap: 2px;
}
.toggle-btn {
  padding: 8px 20px; border-radius: 100px; font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  transition: all 0.2s; color: rgba(255,255,255,0.6); background: transparent;
}
.toggle-btn.active { background: var(--white); color: var(--navy); }
.pricing-save-badge {
  background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3);
  color: #4ade80; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
}
.pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; align-items: stretch; }
.pricing-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-xl); padding: 32px;
  display: flex; flex-direction: column; gap: 8px;
  transition: all 0.25s; position: relative; overflow: hidden;
}
.pricing-card:hover { border-color: rgba(10,146,155,0.3); transform: translateY(-4px); }
.pricing-card.featured {
  background: rgba(10,146,155,0.06); border-color: rgba(10,146,155,0.35);
  box-shadow: 0 0 60px rgba(10,146,155,0.1);
}
.pricing-recommended {
  position: absolute; top: 0; right: 24px;
  background: linear-gradient(135deg, var(--gold), #077a82);
  color: #ffffff; font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  padding: 5px 14px; border-radius: 0 0 10px 10px; text-transform: uppercase;
}
.pricing-plan { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.pricing-price { font-family: "Space Grotesk", sans-serif; font-size: 2.4rem; font-weight: 800; color: var(--white); line-height: 1; margin: 8px 0 4px; }
.pricing-period { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }
.pricing-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 16px 0; }
.pricing-features { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.pricing-feature { display: flex; align-items: center; gap: 8px; font-size: 14px; color: rgba(255,255,255,0.75); }
.pricing-check { width: 18px; height: 18px; border-radius: 50%; background: rgba(74,222,128,0.15); color: #4ade80; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; }
.pricing-cta {
  margin-top: 24px; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; border: none;
  transition: all 0.2s; text-align: center;
  text-decoration: none; display: block;
}
.pricing-cta.outline { background: transparent; border: 1.5px solid rgba(255,255,255,0.2); color: var(--white); }
.pricing-cta.outline:hover { border-color: var(--gold); color: var(--gold); }
.pricing-cta.gold { background: linear-gradient(135deg, var(--gold), #077a82); color: #ffffff; }
.pricing-cta.gold:hover { box-shadow: 0 8px 32px rgba(10,146,155,0.4); transform: translateY(-1px); }

/* ── FAQ ── */
.faq-list { display: flex; flex-direction: column; gap: 0; border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--border-light); }
.faq-item { background: var(--white); border-bottom: 1px solid var(--border-light); }
.faq-item:last-child { border-bottom: none; }
.faq-question {
  width: 100%; text-align: left; padding: 22px 28px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 1rem; font-weight: 600; cursor: pointer; border: none; background: none;
  transition: background 0.2s; gap: 12px; color: var(--text);
}
.faq-question:hover { background: #f8f9fb; }
.faq-chevron { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--off-white); display: flex; align-items: center; justify-content: center; transition: transform 0.25s, background 0.2s; font-size: 12px; }
.faq-chevron.open { transform: rotate(180deg); background: var(--gold-dim); color: var(--gold); }
.faq-answer { padding: 0 28px 22px; font-size: 14px; color: var(--text-muted); line-height: 1.7; }

/* ── LIVE FEED ── */
.live-feed {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-lg); padding: 16px 20px;
  display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow: hidden;
}
.feed-item { display: flex; align-items: center; gap: 10px; animation: feedIn 0.4s ease-out; }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.feed-dot.gold { background: var(--gold); }
.feed-dot.purple { background: var(--purple); }
.feed-dot.green { background: #4ade80; }
.feed-text { font-size: 13px; color: rgba(255,255,255,0.75); flex: 1; }
.feed-time { font-size: 11px; color: rgba(255,255,255,0.3); flex-shrink: 0; }

/* ── BOTTOM CTA ── */
.cta-section {
  background: var(--navy);
  padding: 100px 0; text-align: center;
}
.cta-inner { max-width: 640px; margin: 0 auto; padding: 0 32px; }
.cta-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; color: var(--white); margin-bottom: 16px; }
.cta-sub { font-size: 1.05rem; color: rgba(255,255,255,0.6); line-height: 1.7; margin-bottom: 36px; }
.btn-telegram-cta {
  display: inline-flex; align-items: center; gap: 10px;
  background: linear-gradient(135deg, #2AABEE, #229ED9);
  color: var(--white); font-weight: 800; font-size: 17px;
  padding: 18px 36px; border-radius: 16px; border: none; cursor: pointer;
  box-shadow: 0 8px 32px rgba(34,158,217,0.4); transition: all 0.25s;
  text-decoration: none;
}
.btn-telegram-cta:hover { transform: translateY(-3px); box-shadow: 0 16px 48px rgba(34,158,217,0.5); }

/* ── BETA BANNER ── */
.beta-banner {
  position: fixed; top: 61px; left: 0; right: 0;
  overflow: hidden;
  background: linear-gradient(135deg, #7b1fa2, #9c27b0, #6a1b9a);
  padding: 14px 32px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  flex-wrap: wrap; text-align: center;
  box-shadow: 0 4px 32px rgba(156,39,176,0.35);
  z-index: 99;
}
.beta-banner::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent, transparent 12px,
    rgba(255,255,255,0.03) 12px, rgba(255,255,255,0.03) 24px
  );
}
.beta-banner-text {
  position: relative;
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(1rem, 2.2vw, 1.25rem);
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.01em;

// ── ANIMATED COUNTER ────────────────────────────────────────────
function AnimCounter({ target, duration = 2000 }) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const observer = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        observer.disconnect();
        const start = Date.now();
        const tick = () => {
          const t = Math.min(1, (Date.now() - start) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          setVal(Math.round(ease * target));
          if (t < 1) requestAnimationFrame(tick);
        };
        tick();
      }
    }, { threshold: 0.1 });
    if (el) observer.observe(el);
    return () => observer.disconnect();
  }, [target, duration]);
  return <span ref={ref}>{val.toLocaleString('ru')}</span>;
}

// ── FADE UP ─────────────────────────────────────────────────────
function FadeUp({ children, delay = 0, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    const observer = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        setTimeout(() => el.classList.add('visible'), delay);
        observer.disconnect();
      }
    }, { threshold: 0.1 });
    if (el) observer.observe(el);
    return () => observer.disconnect();
  }, [delay]);
  return <div ref={ref} className={`fade-up ${className}`} style={{ transitionDelay: `${delay}ms` }}>{children}</div>;
}

// ── LIVE FEED ────────────────────────────────────────────────────
// Приводим ответ /api/public/recent-events к тому же формату, что и мок FEED_EVENTS.
function normalizeRemoteEvent(ev) {
  return {
    type: ev.dot || 'gold',
    text: ev.text || '',
    time: ev.time_label || '',
    key: (ev.created_at || '') + '|' + (ev.text || ''),
  };
}

function withKeys(events) {
  return events.map((e, i) => ({ ...e, key: e.key || `mock-${i}-${e.text}` }));
}

function LiveFeed() {
  // Стартуем с мока, чтобы UI не прыгал: сразу подменим реальными, когда придут.
  const [items, setItems] = useState(withKeys(FEED_EVENTS.slice(0, 4)));
  const [remote, setRemote] = useState(null); // null = пока не загрузили; массив = загрузили (возможно пустой)
  const [rotIdx, setRotIdx] = useState(0);

  // Fetch real events on mount + refresh каждые 60 сек
  useEffect(() => {
    let aborted = false;
    const load = async () => {
      try {
        const res = await fetch('/api/public/recent-events?limit=12');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (aborted) return;
        const events = (data.events || []).map(normalizeRemoteEvent);
        setRemote(events);
        if (events.length > 0) {
          setItems(events.slice(0, 4));
        }
      } catch (_e) {
        // Network issue / endpoint unavailable — оставляем мок.
        if (!aborted) setRemote([]);
      }
    };
    load();
    const id = setInterval(load, 60000);
    return () => { aborted = true; clearInterval(id); };
  }, []);

  // Карусель: раз в 4 сек проматываем следующий элемент из пула (реальные или мок).
  useEffect(() => {
    const pool = (remote && remote.length > 0) ? remote : withKeys(FEED_EVENTS);
    if (pool.length <= 4) return; // нечего вращать
    const id = setInterval(() => {
      setRotIdx(i => {
        const next = (i + 1) % pool.length;
        setItems(() => {
          // Берём 4 подряд, циклически — чтобы лента выглядела живой.
          const slice = [];
          for (let k = 0; k < 4; k++) {
            slice.push(pool[(next + k) % pool.length]);
          }
          return slice;
        });
        return next;
      });
    }, 4000);
    return () => clearInterval(id);
  }, [remote]);

  return (
    <div className="live-feed">
      {items.map((item) => (
        <div key={item.key} className="feed-item">
          <span className={`feed-dot ${item.type}`}/>
          <span className="feed-text">{item.text}</span>
          <span className="feed-time">{item.time}</span>
        </div>
      ))}
    </div>
  );
}
